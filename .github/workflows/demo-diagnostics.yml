name: Diagnose demo preview connection
on:
  push:
    branches: [ops/demo-preview-diagnostics]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Check Azure provider connection without exposing credentials
        run: |
          python3 - <<'PY'
          import base64, json, subprocess, urllib.request, urllib.parse
          authentication = subprocess.check_output(['az','account','get-access-token','--resource','https://management.azure.com/','--query','accessToken','-o','tsv']).decode().strip()
          database=subprocess.check_output(['az','webapp','config','appsettings','list','--resource-group','rg-boutiqueos-demo','--name','boutiqueos-api-4746','--query',"[?name=='DATABASE_URL'].value | [0]",'-o','tsv']).decode().strip()
          if not database.startswith('sqlite:////'):
              print('Persistent SQLite path is not configured');raise SystemExit(1)
          path=database[len('sqlite:///'):]
          code="import sqlite3; db=sqlite3.connect("+repr('file:'+path+'?mode=ro')+",uri=True); print('Recent generation results:',db.execute(\"select status,error_code from ai_generation_jobs where merchant_id=1 order by id desc limit 5\").fetchall()); print('Tenant balance:',db.execute(\"select available_credits,reserved_credits,spent_credits from tenant_ai_credit_accounts where merchant_id=1\").fetchall())"
          command='python3 -c exec(bytes('+repr(list(code.encode()))+'))'
          command=command.replace(', ', ',')
          request = urllib.request.Request('https://boutiqueos-api-4746.scm.azurewebsites.net/api/command',data=json.dumps({'command':command,'dir':'/home/site/wwwroot'}).encode(),headers={'Authorization':'Bearer '+authentication,'Content-Type':'application/json'})
          with urllib.request.urlopen(request,timeout=90) as response:
              result=json.load(response)
              print(result.get('Output','')[:3000]);print(result.get('Error','')[:1000]);print('Exit code:',result.get('ExitCode'))
          PY
