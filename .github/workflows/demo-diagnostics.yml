name: Diagnose demo preview connection
on:
  push:
    branches: [ops/demo-preview-diagnostics]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Check Azure provider connection without exposing credentials
        run: |
          python3 - <<'PY'
          import base64, json, subprocess, urllib.request, urllib.parse
          authentication = subprocess.check_output(['az','account','get-access-token','--resource','https://management.azure.com/','--query','accessToken','-o','tsv']).decode().strip()
          for command in ['python3 -c print(1)', '/usr/bin/curl --max-time 20 -s -o /dev/null -w %{http_code} https://fashn-ai-fashn-vton-1-5.hf.space/config', '/bin/tar --zstd -tf /home/site/wwwroot/output.tar.zst']:
              request = urllib.request.Request('https://boutiqueos-api-4746.scm.azurewebsites.net/api/command',data=json.dumps({'command':command,'dir':'/home/site/wwwroot'}).encode(),headers={'Authorization':'Bearer '+authentication,'Content-Type':'application/json'})
              try:
                  with urllib.request.urlopen(request,timeout=100) as response:
                      result=json.load(response)
                      print('Command:',command);print(result.get('Output','')[:2000]);print(result.get('Error','')[:1000]);print('Exit code:',result.get('ExitCode'))
              except Exception as exc:
                  print('Diagnostic access:',type(exc).__name__,getattr(exc,'code',None))
          req=urllib.request.Request('https://boutiqueos-api-4746.scm.azurewebsites.net/api/logs/docker',headers={'Authorization':'Bearer '+authentication})
          with urllib.request.urlopen(req,timeout=60) as response:
              files=json.load(response)
          for log in files[-2:]:
              url=log.get('href') or log.get('url')
              if not url or urllib.parse.urlsplit(url).netloc != 'boutiqueos-api-4746.scm.azurewebsites.net' or not url.startswith('https://'): continue
              req=urllib.request.Request(url,headers={'Authorization':'Bearer '+authentication})
              with urllib.request.urlopen(req,timeout=60) as response:
                  lines=response.read().decode(errors='replace').splitlines()
              for index,line in enumerate(lines):
                  if any(word in line.lower() for word in ['traceback','exception','error:','failed','httpx']):
                      for nearby in lines[max(0,index-2):min(len(lines),index+5)]:
                          if not any(word in nearby.lower() for word in ['password','secret','token','credential']):
                              print(nearby[:1000])
          PY
